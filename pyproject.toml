[project]
name = "vizmith"
version = "0.0.1"
description = "Natural language question to validated chart spec, driven by database metadata"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "databricks-sdk>=0.123",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# DuckDB is the test harness, not part of the product: it writes the fixture Parquet
# and builds the local database the deterministic tests run against.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "duckdb>=1.1",
]

[project.scripts]
vizmith = "vizmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizmith"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests/fixtures"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
