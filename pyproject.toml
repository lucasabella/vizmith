[project]
name = "vizmith"
version = "0.0.1"
description = "Natural language question to validated chart spec, driven by database metadata"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Luca Sabella" }]
keywords = ["visualisation", "charts", "llm", "databricks", "analytics", "sql"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "databricks-sdk>=0.123",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# The DuckDB source: a file on this machine rather than a warehouse. An extra rather than a
# dependency, because somebody pointed at a lakehouse should not install a database engine
# to read it, and the connector imports it only when it is the configured kind.
duckdb = ["duckdb>=1.1"]

# The BigQuery source. Same reasoning: an extra rather than a dependency, imported by the
# connector only when it is the configured kind.
bigquery = ["google-cloud-bigquery>=3.25"]

# The Snowflake source. The credential is not here: the connector reads a named connection
# from ~/.snowflake/connections.toml, the way the Databricks one reads ~/.databrickscfg.
snowflake = ["snowflake-connector-python>=3.12"]

# The PostgreSQL source. The credential is libpq's own business: a service in
# ~/.pg_service.conf, or the standard PG* environment.
postgres = ["psycopg[binary]>=3.3.4"]

# DuckDB is the test harness, not part of the product: it writes the fixture Parquet
# and builds the local database the deterministic tests run against. httpx is not here
# because the model adapter ships with it. Playwright drives the interface in a browser;
# installing it does not install a browser, and the suite that needs one skips where
# there is none, so a checkout that only wants the fast tests pays a wheel and nothing
# else.
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "duckdb>=1.1",
    "google-cloud-bigquery>=3.25",
    "snowflake-connector-python>=3.12",
    "psycopg[binary]>=3.3.4",
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://github.com/lucasabella/vizmith"
Repository = "https://github.com/lucasabella/vizmith"
Issues = "https://github.com/lucasabella/vizmith/issues"
Changelog = "https://github.com/lucasabella/vizmith/commits/main/"

[project.scripts]
vizmith = "vizmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizmith"]

# The interface is built into the wheel, because an installed Vizmith has no checkout to
# serve web/dist out of. See hatch_build.py for what that costs.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src", "tests/fixtures"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["vizmith"]

[tool.coverage.report]
# The suite reaches 98% of the package with no warehouse and no model endpoint. The floor
# is well under that on purpose: it is here to catch a branch of real work arriving with no
# test at all, not to make somebody chase the last two percent, and a threshold that fails
# on noise is one that gets removed. Raise it when the number has been stable for a while.
fail_under = 90
show_missing = true
exclude_also = [
    # The live half. These lines need a warehouse or a model endpoint, so they are the
    # 47 tests that skip here and run against a real workspace.
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
