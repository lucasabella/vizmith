[project]
name = "vizmith"
version = "0.0.1"
description = "Natural language question to validated chart spec, driven by database metadata"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "databricks-sdk>=0.123",
    "jsonschema>=4.23",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# DuckDB is the test harness, not part of the product: it writes the fixture Parquet
# and builds the local database the deterministic tests run against. httpx is not here
# because the model adapter ships with it. Playwright drives the interface in a browser;
# installing it does not install a browser, and the suite that needs one skips where
# there is none, so a checkout that only wants the fast tests pays a wheel and nothing
# else.
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "duckdb>=1.1",
    "playwright>=1.49",
]

[project.scripts]
vizmith = "vizmith.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vizmith"]

# The interface is built into the wheel, because an installed Vizmith has no checkout to
# serve web/dist out of. See hatch_build.py for what that costs.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src", "tests/fixtures"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
