# The offline suite, run where a reviewer can see it. Everything here is what a person
# already runs by hand; nothing is added to the tests to make them pass on a runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# No secret is used and none is granted. The warehouse tests skip by construction when
# VIZMITH_DATABRICKS_PROFILE and VIZMITH_DATABRICKS_WAREHOUSE are absent, and a runner
# has neither, so the offline half runs and the live half stays out. Adding credentials
# here would buy the live half at the price of a workspace reachable from a public
# repository's CI and a warehouse bill on every push.
permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both versions are named rather than left to the runner's default. The fixture
      # reproducibility test compares committed Parquet against a fresh write, and that
      # is tied to the DuckDB version that wrote it, per ROADMAP.md. An interpreter that
      # floats underneath changes which duckdb wheel gets installed and fails that test
      # for a reason that has nothing to do with the change under review.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the package with its dev extra
        run: pip install -e '.[dev]'

      - name: ruff check .
        run: ruff check .

      - name: pytest
        run: pytest

      # ci rather than install, because the lockfile is committed and a review should see
      # the dependency versions the author had.
      - name: Install the frontend
        working-directory: web
        run: npm ci

      - name: npm test
        working-directory: web
        run: npm test

      # Both ecosystems, asked whether anything they depend on has a known hole. High and
      # above only: a moderate advisory in a build-time dev dependency is not a reason to
      # fail somebody's pull request, and a threshold nobody believes gets muted.
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high

      # --skip-editable because the package under test is installed editable and is not on
      # PyPI, so auditing it is asking about a distribution that does not exist. Its
      # dependencies are installed normally and are what this is here to check. Not
      # --strict, which would turn that skip back into the failure it is avoiding.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: npm run build
        working-directory: web
        run: npm run build

      # The wheel carries the built interface, because an installed Vizmith has no checkout
      # to serve web/dist out of. A build hook that quietly stopped doing that would only be
      # noticed by whoever released next, so it is checked here, where Node already is.
      - name: Build the wheel and check the interface is inside it
        run: |
          pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          inside = zipfile.ZipFile(wheel).namelist()
          sys.exit(0 if "vizmith/web/index.html" in inside else f"{wheel} carries no interface")
          PY

  # A separate job rather than a step in the one above, because a browser can fail for
  # reasons that belong to the runner rather than to the change under review, and a flake
  # inside the suite would read as the suite failing. It is here at all because the class
  # of bug it catches is invisible to everything else: every other frontend test is a
  # static render, and the state bug #59 shipped passed all of them. See ROADMAP.md.
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the package with its dev extra
        run: pip install -e '.[dev]'

      # Chromium only. The suite drives one browser, and installing three would triple
      # the slowest step in CI to cover engines nothing here is written against.
      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Build the frontend the server serves
        working-directory: web
        run: npm ci && npm run build

      - name: pytest tests/test_interface.py
        run: pytest tests/test_interface.py
